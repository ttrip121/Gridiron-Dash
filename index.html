<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gridiron Dash</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
  }
  canvas {
    background: #2e7d32;
    display: block;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    border: 4px solid #111;
    border-radius: 6px;
  }
  #hint {
    position: absolute;
    bottom: -34px;
    left: 0;
    right: 0;
    text-align: center;
    color: #bbb;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="420" height="640"></canvas>
  <div id="hint">Space to toggle colorway &middot; Enter to kick off &middot; Left / Right arrows to juke defenders &middot; Esc to return home.</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const FIELD_MARGIN = 40;          // sideline margin
const PLAYER_W = 28, PLAYER_H = 40;
const DEF_W = 28, DEF_H = 40;
const TOTAL_YARDS = 100;          // yards from start to endzone
const PIXELS_PER_YARD = 22;
const ENDZONE_DEPTH = 60;
const DEFENSE_START_YARDS_TO_GO = 90; // the first 10 yards are unopposed; the defense waits at the 90
const CHAMPIONSHIP_LEVEL = 10; // reaching this many touchdowns in one streak wins the game

// Conference-inspired colorways the runner can choose between (generic colors, not team logos).
// BIG TEN mirrors a navy-and-maize winged helmet look; SEC mirrors a crimson-and-white look.
const COLORWAYS = [
  { name: 'BIG TEN', helmet: '#00274C', jersey: '#00274C', accent: '#FFCB05', pants: '#FFCB05', helmetStyle: 'winged' },
  { name: 'SEC',      helmet: '#9E1B32', jersey: '#9E1B32', accent: '#FFFFFF', pants: '#F2F2F2', helmetStyle: 'stripe' }
];
// Silver-and-white defense with a scarlet stripe (the Big Ten opponent look), swapped for
// orange & white when the SEC colorway is picked
const DEFENSE_COLORS = { helmet: '#A6A9AA', jersey: '#FFFFFF', accent: '#BB0000', pants: '#C7C9CB' };
const DEFENSE_COLORS_SEC = { helmet: '#FF7F00', jersey: '#FF7F00', accent: '#FFFFFF', pants: '#FFFFFF' };

let colorwayIndex = 0;
let frameClock = 0; // always-on clock for idle/run animation, independent of game state

// Persists across touchdown-to-touchdown runs within a session: every score makes the
// defense's tracking sharper. A tackle -- and only a tackle -- resets it to zero.
let difficultyLevel = 0;

let state = 'select'; // select | playing | tackled | touchdown | champion

let player, defenders, yardsToGo, worldY, speed, spawnTimer, elapsed;

function resetGame() {
  player = { x: W / 2 - PLAYER_W / 2, y: H - 110, vx: 0 };
  defenders = [];          // the field starts empty -- defenders trickle in once you reach the 90
  yardsToGo = TOTAL_YARDS;
  worldY = 0;             // total scrolled distance in pixels
  speed = 2.6;            // base scroll speed (yards feel) -- always restarts here after a tackle
  spawnTimer = 0;
  elapsed = 0;            // progressive difficulty timer -- always restarts here after a tackle
  initStands();           // re-theme the crowd to whichever conference is currently selected
}

const keys = { left: false, right: false };

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
  if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }

  // ESC always bails out back to the home screen, from any state, ending the run
  if (e.key === 'Escape' && state !== 'select') {
    difficultyLevel = 0;
    state = 'select';
    return;
  }

  if (state === 'select') {
    if (e.key === ' ' || e.code === 'Space' || e.key === 'Spacebar') {
      colorwayIndex = 1 - colorwayIndex;
      e.preventDefault();
    } else if (e.key === 'Enter') {
      resetGame();
      state = 'playing';
    }
  } else if (state === 'touchdown') {
    // touchdowns chain together -- keep the level (and its difficulty) going
    if (e.key === 'Enter') {
      resetGame();
      state = 'playing';
    }
  } else if (state === 'tackled') {
    // getting tackled ends the run: back to picking a conference, difficulty reset
    if (e.key === 'Enter') {
      difficultyLevel = 0;
      state = 'select';
    }
  } else if (state === 'champion') {
    // reached the national championship -- back to the home screen, difficulty reset
    if (e.key === 'Enter') {
      difficultyLevel = 0;
      state = 'select';
    }
  }
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
});

function spawnDefender(initialY) {
  const minX = FIELD_MARGIN + 10;
  const maxX = W - FIELD_MARGIN - DEF_W - 10;
  defenders.push({
    x: minX + Math.random() * (maxX - minX),
    y: initialY !== undefined ? initialY : -DEF_H - Math.random() * 40,
    vx: 0,
    swaySeed: Math.random() * Math.PI * 2,
    number: [90, 55, 44, 21, 34, 62][Math.floor(Math.random() * 6)],
    passed: false,   // has it already been juked? (triggers the diving animation)
    diveAt: 0         // frameClock timestamp when it started diving
  });
}

function update(dt) {
  if (state !== 'playing') return;
  elapsed += dt;

  // difficulty ramps up slowly
  speed = 2.6 + Math.min(2.4, elapsed / 12000 * 2.4);

  // player horizontal movement
  const accel = 0.9;
  const maxV = 5.2;
  if (keys.left && !keys.right) player.vx = Math.max(player.vx - accel, -maxV);
  else if (keys.right && !keys.left) player.vx = Math.min(player.vx + accel, maxV);
  else player.vx *= 0.8;

  player.x += player.vx;
  if (player.x < FIELD_MARGIN) { player.x = FIELD_MARGIN; player.vx = 0; }
  if (player.x > W - FIELD_MARGIN - PLAYER_W) { player.x = W - FIELD_MARGIN - PLAYER_W; player.vx = 0; }

  // scroll world -> player advances downfield
  worldY += speed;
  yardsToGo = Math.max(0, TOTAL_YARDS - worldY / PIXELS_PER_YARD);

  // Every defender tracks the runner's lane -- the whole defense plays like the old
  // single "spy" used to. Difficulty (raised only by scoring touchdowns) sharpens how
  // fast they can turn and how quickly they can close the gap.
  const chaseGain = Math.min(0.22, 0.07 + difficultyLevel * 0.015);
  const chaseCap = Math.min(6.2, 2.8 + difficultyLevel * 0.35);

  for (const d of defenders) {
    d.y += speed;
    if (d.passed) {
      // already juked -- it's committed to the dive, no more steering
      continue;
    }
    if (d.y > player.y) {
      // just cleared the runner's row without a tackle: start the diving animation
      d.passed = true;
      d.diveAt = frameClock;
      d.vx = 0;
      continue;
    }
    const target = player.x + (PLAYER_W - DEF_W) / 2;
    const diff = target - d.x;
    d.vx = Math.sign(diff) * Math.min(Math.abs(diff) * chaseGain, chaseCap);
    d.x += d.vx;
    if (d.x < FIELD_MARGIN) { d.x = FIELD_MARGIN; d.vx = Math.abs(d.vx); }
    if (d.x > W - FIELD_MARGIN - DEF_W) { d.x = W - FIELD_MARGIN - DEF_W; d.vx = -Math.abs(d.vx); }
  }

  // Drop defenders once they scroll off the bottom of the screen, or the instant their
  // box would actually be drawn overlapping the endzone rectangle. (An earlier version
  // compared on-screen y to the endzone's on-screen position with a one-sided test, e.g.
  // "d.y >= ezTop" -- but since both scroll at the same rate as worldY, that difference is
  // a spawn-time constant, not something that tracks real proximity: any on-screen y is
  // trivially ">= ezTop" whenever ezTop is small or negative, which is most of the game,
  // so it either fired for every defender at once or missed genuine overlaps depending on
  // which side of the sprite it checked. A real overlap test needs BOTH box edges, clipped
  // to what's actually on screen right now.)
  const ezTop = computeEndzoneTop();
  const ezBottom = ezTop + ENDZONE_DEPTH;
  defenders = defenders.filter(d => {
    if (d.y >= H + 60) return false;
    const overlapTop = Math.max(d.y, ezTop, 0);
    const overlapBottom = Math.min(d.y + DEF_H, ezBottom, H);
    return overlapBottom <= overlapTop; // keep it only if there's no visible overlap
  });

  // the defense doesn't take the field until you've cleared the first 10 yards; from
  // there it spawns as originally designed, one at a time, faster as the drive goes on
  if (yardsToGo <= DEFENSE_START_YARDS_TO_GO) {
    spawnTimer -= dt;
    const spawnInterval = Math.max(420, 900 - elapsed / 20);
    if (spawnTimer <= 0) {
      // A defender's on-screen y scrolls in lockstep with worldY, so the "field position"
      // it represents (where it'll actually meet the runner's row) is fixed the moment it
      // spawns. Using the farthest-off-screen possible spawn point, skip spawning once that
      // fixed position would already be at or past the goal line -- this is what keeps the
      // defense from ever appearing beyond the endzone, without needing to cull anyone
      // mid-flight (which is what caused the disappearing-defenders bug above).
      const worstCaseSpawnY = -(DEF_H + 40);
      const wouldStandBeyondGoalLine = worldY + (player.y - worstCaseSpawnY) >= TOTAL_YARDS * PIXELS_PER_YARD;
      if (!wouldStandBeyondGoalLine) {
        spawnDefender();
      }
      spawnTimer = spawnInterval;
    }
  }

  // collision check (a diver that's already "passed" no longer poses a threat, but its
  // box briefly still overlaps right as it crosses, which is exactly when a real tackle
  // should still count)
  for (const d of defenders) {
    if (rectsOverlap(player.x, player.y, PLAYER_W, PLAYER_H, d.x, d.y, DEF_W, DEF_H)) {
      state = 'tackled';
      break;
    }
  }

  if (yardsToGo <= 0) {
    difficultyLevel++; // each touchdown makes the next drive's defense track harder
    state = difficultyLevel >= CHAMPIONSHIP_LEVEL ? 'champion' : 'touchdown';
  }
}

// Screen-space y of the endzone's near edge (its goal line), shared by update() and drawField().
function computeEndzoneTop() {
  return H - (TOTAL_YARDS * PIXELS_PER_YARD - worldY) - ENDZONE_DEPTH;
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  const pad = 6; // slight forgiveness for a more fun feel
  return ax + pad < bx + bw - pad &&
         ax + aw - pad > bx + pad &&
         ay + pad < by + bh - pad &&
         ay + ah - pad > by + pad;
}

const GRASS_LIGHT = '#2e7d32';
const GRASS_DARK = '#296b2c';
let grassNoisePattern = null;

function initGrassTexture() {
  const tile = document.createElement('canvas');
  tile.width = 48;
  tile.height = 48;
  const tctx = tile.getContext('2d');
  for (let i = 0; i < 260; i++) {
    const gx = Math.random() * tile.width;
    const gy = Math.random() * tile.height;
    const light = Math.random() < 0.5;
    tctx.fillStyle = light ? 'rgba(255,255,255,0.05)' : 'rgba(0,20,0,0.10)';
    const len = 2 + Math.random() * 3;
    tctx.fillRect(gx, gy, 1.2, len); // thin blade-like streaks
  }
  grassNoisePattern = ctx.createPattern(tile, 'repeat');
}

// One shared crowd system for every stand (sides and the back band) so they all look
// and move exactly alike and blend into a single continuous stadium bowl.
let sideFans = [];
let backFans = [];

// Builds a stable list of fan "seats" across a width x height area, dressed in the
// selected conference's colors. Generated once (not re-rolled every frame) so the crowd
// doesn't flicker -- each fan just bobs in place to suggest cheering.
function generateFanList(width, height) {
  const cw = COLORWAYS[colorwayIndex];
  const fanColors = [cw.jersey, cw.jersey, cw.jersey, cw.accent, cw.accent, '#f4f4f4', '#2b2b2b'];
  const fans = [];
  for (let y = 6; y < height - 6; y += 11) {
    for (let x = 4; x < width - 3; x += 8) {
      if (Math.random() < 0.82) {
        fans.push({
          x: x + (Math.random() * 3 - 1.5),
          y: y + (Math.random() * 3 - 1.5),
          color: fanColors[Math.floor(Math.random() * fanColors.length)],
          phase: Math.random() * Math.PI * 2,
          speed: 0.7 + Math.random() * 0.7
        });
      }
    }
  }
  return fans;
}

function initStands() {
  sideFans = generateFanList(FIELD_MARGIN, H);
  backFans = generateFanList(W, H); // generous height; drawBackStands clips to what's visible
}

// Draws a bleacher deck (gradient + row seams) filling the given rect.
// isVerticalStrip: true for the narrow side stands (shaded left-to-right, like the
// original side texture); false for the wide back band (shaded top-to-bottom). Every
// deck's row seams run horizontally either way -- that's what reads as bleacher rows.
function drawBleacherDeck(x, y, w, h, isVerticalStrip) {
  const grad = isVerticalStrip
    ? ctx.createLinearGradient(x, 0, x + w, 0)
    : ctx.createLinearGradient(0, y, 0, y + h);
  grad.addColorStop(0, '#54565c');
  grad.addColorStop(1, '#3a3c40');
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, h);

  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  for (let sy = y; sy < y + h; sy += 14) {
    ctx.beginPath();
    ctx.moveTo(x, sy);
    ctx.lineTo(x + w, sy);
    ctx.stroke();
  }
}

// Draws a fan list at the given origin, each one bobbing up and down in place --
// a crowd of fans cheering, rather than a static printed texture.
function drawFans(fans, originX, originY) {
  for (const f of fans) {
    const bob = Math.sin(frameClock / 260 * f.speed + f.phase) * 1.8;
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.arc(originX + f.x, originY + f.y + bob, 2.1, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Positive modulo (JS's % can return negative for a negative dividend).
function mod(n, m) {
  return ((n % m) + m) % m;
}

function drawField() {
  // crowd-filled, cheering stands along both sidelines
  drawBleacherDeck(0, 0, FIELD_MARGIN, H, true);
  drawFans(sideFans, 0, 0);
  ctx.save();
  ctx.translate(W, 0);
  ctx.scale(-1, 1);
  drawBleacherDeck(0, 0, FIELD_MARGIN, H, true);
  drawFans(sideFans, 0, 0);
  ctx.restore();

  // Mowed-stripe bands and yard lines scroll using -worldY (instead of worldY) so the
  // field flows toward the runner -- the same direction the endzone and defenders
  // already move -- rather than drifting up and away from them.
  const stripeH = PIXELS_PER_YARD * 5;
  const stripeOffset = mod(-worldY, stripeH);
  let parity = mod(Math.floor(-worldY / stripeH), 2);
  for (let y = -stripeOffset; y < H; y += stripeH) {
    ctx.fillStyle = parity === 0 ? GRASS_LIGHT : GRASS_DARK;
    ctx.fillRect(FIELD_MARGIN, y, W - 2 * FIELD_MARGIN, stripeH + 1);
    parity = 1 - parity;
  }

  // subtle blade texture overlay
  if (grassNoisePattern) {
    ctx.fillStyle = grassNoisePattern;
    ctx.fillRect(FIELD_MARGIN, 0, W - 2 * FIELD_MARGIN, H);
  }

  // sidelines
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(FIELD_MARGIN, 0); ctx.lineTo(FIELD_MARGIN, H);
  ctx.moveTo(W - FIELD_MARGIN, 0); ctx.lineTo(W - FIELD_MARGIN, H);
  ctx.stroke();

  // scrolling yard lines
  const lineSpacing = PIXELS_PER_YARD * 5; // every 5 yards
  const offset = mod(-worldY, lineSpacing);
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 2;
  for (let y = -offset; y < H; y += lineSpacing) {
    ctx.beginPath();
    ctx.moveTo(FIELD_MARGIN, y);
    ctx.lineTo(W - FIELD_MARGIN, y);
    ctx.stroke();
  }

  // endzone approaches as yardsToGo shrinks, colored to match the selected conference
  const ezTop = computeEndzoneTop();
  if (ezTop < H) {
    const cw = COLORWAYS[colorwayIndex];
    ctx.fillStyle = cw.jersey;
    ctx.fillRect(FIELD_MARGIN, Math.max(-ENDZONE_DEPTH, ezTop), W - 2 * FIELD_MARGIN, ENDZONE_DEPTH);
    ctx.fillStyle = cw.accent;
    ctx.font = 'bold 16px Segoe UI';
    ctx.textAlign = 'center';
    ctx.save();
    ctx.translate(W / 2, Math.max(-ENDZONE_DEPTH, ezTop) + ENDZONE_DEPTH / 2);
    ctx.fillText('END ZONE', 0, 5);
    ctx.restore();

    // The true end of the field: stands fill every pixel above the endzone (no grass
    // visible beyond it at all), tying into the side stands, with a goalpost planted
    // right on the boundary between the two.
    if (ezTop > 0) {
      drawBackStands(0, ezTop);
    }
    drawGoalpost(W / 2, ezTop);
  }
}

// A crowd-filled band closing off the far end of the field, full width and running from
// the very top of the screen down to the endzone, so the side stands appear to wrap all
// the way around behind it with no grass visible beyond the goalpost.
function drawBackStands(bandTop, bandBottom) {
  drawBleacherDeck(0, bandTop, W, bandBottom - bandTop, false);

  // backFans was generated top-anchored (rows starting near y=0), which lines up
  // exactly with this band's own coordinates, so just clip to what's currently visible.
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, bandTop, W, bandBottom - bandTop);
  ctx.clip();
  drawFans(backFans, 0, 0);
  ctx.restore();
}

// A simple yellow "slingshot" goalpost planted right at the back of the endzone.
function drawGoalpost(cx, groundY) {
  const halfSpan = 34, uprightH = 46;
  ctx.strokeStyle = '#f5d000';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';

  // support post anchoring the structure to the back line
  ctx.beginPath();
  ctx.moveTo(cx, groundY + 14);
  ctx.lineTo(cx, groundY);
  ctx.stroke();

  // crossbar
  ctx.beginPath();
  ctx.moveTo(cx - halfSpan, groundY);
  ctx.lineTo(cx + halfSpan, groundY);
  ctx.stroke();

  // uprights
  ctx.beginPath();
  ctx.moveTo(cx - halfSpan, groundY);
  ctx.lineTo(cx - halfSpan, groundY - uprightH);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + halfSpan, groundY);
  ctx.lineTo(cx + halfSpan, groundY - uprightH);
  ctx.stroke();
}

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// Draws a stylized, lifelike human football player (helmet, pads, jersey, running legs/arms)
// centered horizontally at cx, with its bounding box top at topY and size w x h. Pass
// diveProgress (0-1) to draw a defender lunging/diving forward after missing a tackle,
// instead of the normal running pose.
function drawFootballPlayer(c, cx, topY, w, h, colors, number, frame, diveProgress) {
  if (diveProgress > 0) {
    drawDivingPlayer(c, cx, topY, w, h, colors, number, diveProgress);
    return;
  }

  const skin = '#c68a5c';
  const cleat = '#161616';
  const stride = frame === 0 ? 1 : -1;

  const hipY = topY + h * 0.56;
  const shoulderY = topY + h * 0.30;
  const helmetR = w * 0.30;
  const helmetCY = topY + helmetR * 1.05;

  c.save();
  c.translate(cx, 0);

  // legs (running stride)
  c.strokeStyle = colors.pants;
  c.lineWidth = w * 0.22;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(-w * 0.11, hipY);
  c.lineTo(-w * 0.11 - stride * w * 0.16, topY + h * 0.97);
  c.stroke();
  c.beginPath();
  c.moveTo(w * 0.11, hipY);
  c.lineTo(w * 0.11 + stride * w * 0.16, topY + h * 0.97);
  c.stroke();

  // cleats
  c.fillStyle = cleat;
  c.beginPath(); c.arc(-w * 0.11 - stride * w * 0.16, topY + h * 0.97, w * 0.1, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(w * 0.11 + stride * w * 0.16, topY + h * 0.97, w * 0.1, 0, Math.PI * 2); c.fill();

  // arms (swing opposite the legs)
  c.strokeStyle = skin;
  c.lineWidth = w * 0.14;
  c.beginPath();
  c.moveTo(-w * 0.30, shoulderY + h * 0.03);
  c.lineTo(-w * 0.30 + stride * w * 0.18, shoulderY + h * 0.26);
  c.stroke();
  c.beginPath();
  c.moveTo(w * 0.30, shoulderY + h * 0.03);
  c.lineTo(w * 0.30 - stride * w * 0.18, shoulderY + h * 0.26);
  c.stroke();

  // torso / jersey
  c.fillStyle = colors.jersey;
  roundRectPath(c, -w * 0.32, topY + h * 0.24, w * 0.64, h * 0.36, w * 0.14);
  c.fill();

  // shoulder pad accent stripe
  c.fillStyle = colors.accent;
  c.fillRect(-w * 0.32, topY + h * 0.24, w * 0.64, h * 0.06);

  // jersey number
  c.fillStyle = colors.accent;
  c.font = `bold ${Math.round(h * 0.20)}px Segoe UI`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(String(number), 0, topY + h * 0.44);

  // neck
  c.fillStyle = skin;
  c.fillRect(-w * 0.08, topY + h * 0.20, w * 0.16, h * 0.08);

  // helmet
  c.fillStyle = colors.helmet;
  c.beginPath();
  c.arc(0, helmetCY, helmetR, 0, Math.PI * 2);
  c.fill();

  // facemask
  c.strokeStyle = '#2b2b2b';
  c.lineWidth = 2;
  c.beginPath();
  c.arc(0, helmetCY + helmetR * 0.2, helmetR * 0.68, 0.1 * Math.PI, 0.9 * Math.PI);
  c.stroke();

  if (colors.helmetStyle === 'winged') {
    drawWingedHelmetDecal(c, helmetCY, helmetR, colors.accent);
  } else {
    // simple helmet center stripe
    c.strokeStyle = colors.accent;
    c.lineWidth = 2.5;
    c.beginPath();
    c.moveTo(0, helmetCY - helmetR);
    c.lineTo(0, helmetCY + helmetR * 0.4);
    c.stroke();
  }

  c.restore();
}

// A defender who has just missed a tackle: lunging forward, arms outstretched, legs
// trailing up behind, tipping toward prone as diveProgress goes from 0 to 1.
function drawDivingPlayer(c, cx, topY, w, h, colors, number, t) {
  const skin = '#c68a5c';
  const cleat = '#161616';
  const helmetR = w * 0.30;
  const lean = Math.min(1, t);

  c.save();
  c.translate(cx, topY + h * 0.16 * lean);
  c.rotate(-0.22 * lean);

  const hipY = h * 0.50;
  const shoulderY = h * 0.26;

  // legs together, kicked up behind as the body goes horizontal
  c.strokeStyle = colors.pants;
  c.lineWidth = w * 0.24;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(0, hipY);
  c.lineTo(w * 0.08 * lean, hipY + h * (0.32 - 0.14 * lean));
  c.stroke();
  c.fillStyle = cleat;
  c.beginPath();
  c.arc(w * 0.08 * lean, hipY + h * (0.32 - 0.14 * lean), w * 0.1, 0, Math.PI * 2);
  c.fill();

  // arms stretched forward together, reaching past the helmet
  c.strokeStyle = skin;
  c.lineWidth = w * 0.15;
  c.beginPath();
  c.moveTo(-w * 0.17, shoulderY);
  c.lineTo(-w * 0.05, shoulderY - h * (0.32 + 0.18 * lean));
  c.stroke();
  c.beginPath();
  c.moveTo(w * 0.17, shoulderY);
  c.lineTo(w * 0.05, shoulderY - h * (0.32 + 0.18 * lean));
  c.stroke();

  // torso
  c.fillStyle = colors.jersey;
  roundRectPath(c, -w * 0.32, h * 0.20, w * 0.64, h * 0.34, w * 0.14);
  c.fill();
  c.fillStyle = colors.accent;
  c.fillRect(-w * 0.32, h * 0.20, w * 0.64, h * 0.06);
  c.fillStyle = colors.accent;
  c.font = `bold ${Math.round(h * 0.20)}px Segoe UI`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(String(number), 0, h * 0.40);

  // neck
  c.fillStyle = skin;
  c.fillRect(-w * 0.08, h * 0.16, w * 0.16, h * 0.08);

  // helmet
  c.fillStyle = colors.helmet;
  c.beginPath();
  c.arc(0, h * 0.12, helmetR, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = '#2b2b2b';
  c.lineWidth = 2;
  c.beginPath();
  c.arc(0, h * 0.12 + helmetR * 0.2, helmetR * 0.68, 0.1 * Math.PI, 0.9 * Math.PI);
  c.stroke();

  c.restore();
}

// Traditional "winged" helmet decal (as on the Michigan Wolverines helmet): a fan of
// pointed feather shapes sweeping back from the center of the helmet on each side.
function drawWingedHelmetDecal(c, helmetCY, r, accent) {
  const originX = 0, originY = helmetCY - r * 0.08;
  const angles = [24, 50, 76].map(d => d * Math.PI / 180); // degrees from straight up
  const lens = [0.86, 1.0, 0.8];
  const halfWidths = [0.075, 0.11, 0.075];

  c.fillStyle = accent;
  c.strokeStyle = 'rgba(0,0,0,0.35)';
  c.lineWidth = 1;

  for (const side of [-1, 1]) {
    for (let i = 0; i < angles.length; i++) {
      const a = angles[i];
      const L = lens[i] * r;
      const hw = halfWidths[i] * r;
      const dx = side * Math.sin(a), dy = -Math.cos(a);
      const px = side * Math.cos(a), py = Math.sin(a); // perpendicular

      const tipX = originX + dx * L, tipY = originY + dy * L;
      const midX = originX + dx * L * 0.55, midY = originY + dy * L * 0.55;
      const outerCtrlX = midX + px * hw, outerCtrlY = midY + py * hw;
      const innerCtrlX = midX - px * hw * 0.5, innerCtrlY = midY - py * hw * 0.5;

      c.beginPath();
      c.moveTo(originX, originY);
      c.quadraticCurveTo(outerCtrlX, outerCtrlY, tipX, tipY);
      c.quadraticCurveTo(innerCtrlX, innerCtrlY, originX, originY);
      c.closePath();
      c.fill();
      c.stroke();
    }
  }
}

function drawPlayer() {
  const frame = Math.floor(frameClock / 130) % 2;
  drawFootballPlayer(ctx, player.x + PLAYER_W / 2, player.y, PLAYER_W, PLAYER_H, COLORWAYS[colorwayIndex], 7, frame);
}

function drawDefenders() {
  const defColors = colorwayIndex === 1 ? DEFENSE_COLORS_SEC : DEFENSE_COLORS;
  for (const d of defenders) {
    const frame = Math.floor((frameClock + d.swaySeed * 300) / 130) % 2;
    const diveProgress = d.passed ? Math.min(1, (frameClock - d.diveAt) / 220) : 0;
    drawFootballPlayer(ctx, d.x + DEF_W / 2, d.y, DEF_W, DEF_H, defColors, d.number, frame, diveProgress);
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, 30);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px Segoe UI';
  ctx.textAlign = 'left';
  ctx.fillText(`YARDS TO GO: ${Math.max(0, Math.ceil(yardsToGo))}`, 10, 20);
  if (difficultyLevel > 0) {
    ctx.textAlign = 'right';
    ctx.fillText(`LEVEL: ${difficultyLevel}`, W - 10, 20);
  }
}

function drawOverlay(title, subtitle) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 30px Segoe UI';
  ctx.fillText(title, W / 2, H / 2 - 10);
  ctx.font = '16px Segoe UI';
  ctx.fillText(subtitle, W / 2, H / 2 + 24);
}

// A generic, stylized championship trophy (cup, handles, stem, and a two-tier base) --
// not a depiction of any specific real-world trophy.
function drawTrophy(c, cx, baseY, scale) {
  const w = 100 * scale, h = 150 * scale;
  c.save();
  c.translate(cx, baseY);

  // base (two-tier plinth)
  c.fillStyle = '#2b2b2b';
  c.fillRect(-w * 0.38, -h * 0.07, w * 0.76, h * 0.07);
  c.fillStyle = '#3a2f1a';
  c.fillRect(-w * 0.28, -h * 0.13, w * 0.56, h * 0.06);

  // stem
  c.fillStyle = '#e8c766';
  c.fillRect(-w * 0.06, -h * 0.32, w * 0.12, h * 0.19);

  // handles (drawn before the bowl so the bowl's outline sits on top)
  c.strokeStyle = '#caa43d';
  c.lineWidth = w * 0.07;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(-w * 0.40, -h * 0.60);
  c.quadraticCurveTo(-w * 0.64, -h * 0.55, -w * 0.40, -h * 0.41);
  c.stroke();
  c.beginPath();
  c.moveTo(w * 0.40, -h * 0.60);
  c.quadraticCurveTo(w * 0.64, -h * 0.55, w * 0.40, -h * 0.41);
  c.stroke();

  // bowl (chalice shape, wide rim tapering down to the stem)
  c.beginPath();
  c.moveTo(-w * 0.05, -h * 0.32);
  c.quadraticCurveTo(-w * 0.46, -h * 0.46, -w * 0.40, -h * 0.63);
  c.quadraticCurveTo(-w * 0.38, -h * 0.80, 0, -h * 0.82);
  c.quadraticCurveTo(w * 0.38, -h * 0.80, w * 0.40, -h * 0.63);
  c.quadraticCurveTo(w * 0.46, -h * 0.46, w * 0.05, -h * 0.32);
  c.closePath();
  const bowlGrad = c.createLinearGradient(-w * 0.4, -h * 0.82, w * 0.4, -h * 0.32);
  bowlGrad.addColorStop(0, '#fff6d8');
  bowlGrad.addColorStop(0.5, '#ffd75e');
  bowlGrad.addColorStop(1, '#caa43d');
  c.fillStyle = bowlGrad;
  c.fill();
  c.strokeStyle = '#8a6d1f';
  c.lineWidth = 2;
  c.stroke();

  // a small football emblem on the bowl's face
  c.save();
  c.translate(0, -h * 0.56);
  c.rotate(-0.5);
  c.fillStyle = '#6b3b12';
  c.beginPath();
  c.ellipse(0, 0, w * 0.11, w * 0.07, 0, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = '#fff8e8';
  c.lineWidth = 1.2;
  c.beginPath();
  c.moveTo(-w * 0.06, 0);
  c.lineTo(w * 0.06, 0);
  c.stroke();
  c.restore();

  // a star above the rim
  c.fillStyle = '#fff6d8';
  drawStar(c, 0, -h * 0.90, w * 0.05, w * 0.02, 5);

  c.restore();
}

function drawStar(c, cx, cy, outerR, innerR, points) {
  c.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const a = (Math.PI / points) * i - Math.PI / 2;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  c.closePath();
  c.fill();
}

// The "you win" screen shown once the runner reaches CHAMPIONSHIP_LEVEL.
function drawChampionScreen() {
  const cw = COLORWAYS[colorwayIndex];

  const glow = ctx.createRadialGradient(W / 2, H * 0.42, 20, W / 2, H * 0.42, H * 0.75);
  glow.addColorStop(0, '#4a3a12');
  glow.addColorStop(1, '#0b0904');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // a little confetti in the runner's chosen colors
  const confettiColors = [cw.jersey, cw.accent, '#ffd75e'];
  for (let i = 0; i < 60; i++) {
    const cx = mod(i * 137.5, W);
    const cy = mod(i * 91.3 + frameClock / 12, H);
    ctx.fillStyle = confettiColors[i % confettiColors.length];
    ctx.fillRect(cx, cy, 3, 8);
  }

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 24px Segoe UI';
  ctx.fillText('NATIONAL CHAMPIONS', W / 2, 66);

  drawTrophy(ctx, W / 2, H * 0.64, 1.35);

  ctx.font = 'bold 36px Segoe UI';
  ctx.fillStyle = cw.accent;
  ctx.fillText('YOU WIN!', W / 2, H - 56);
  ctx.font = '15px Segoe UI';
  ctx.fillStyle = '#eee';
  ctx.fillText('Press ENTER to return to the home screen', W / 2, H - 28);
}

let selectSceneCanvas = null;

// Pre-renders a stylized autumn campus scene (sky, tower, buildings, fall-colored trees,
// drifting/fallen leaves, and a crowd of fans on the quad) once, so the select screen can
// just blit it each frame.
function initSelectScene() {
  const sc = document.createElement('canvas');
  sc.width = W;
  sc.height = H;
  const s = sc.getContext('2d');
  const horizonY = H * 0.58;

  // crisp autumn afternoon sky
  const sky = s.createLinearGradient(0, 0, 0, horizonY);
  sky.addColorStop(0, '#6f97c9');
  sky.addColorStop(0.55, '#bcd3e6');
  sky.addColorStop(0.85, '#f3dcae');
  sky.addColorStop(1, '#f6c98a');
  s.fillStyle = sky;
  s.fillRect(0, 0, W, horizonY);

  // low autumn sun glow + disc
  const sunX = W * 0.5, sunY = horizonY - 45, sunR = 38;
  const glow = s.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 2.4);
  glow.addColorStop(0, 'rgba(255,240,200,0.9)');
  glow.addColorStop(0.5, 'rgba(255,210,140,0.30)');
  glow.addColorStop(1, 'rgba(255,210,140,0)');
  s.fillStyle = glow;
  s.fillRect(sunX - sunR * 2.4, sunY - sunR * 2.4, sunR * 4.8, sunR * 4.8);
  s.fillStyle = '#fff6df';
  s.beginPath(); s.arc(sunX, sunY, sunR, 0, Math.PI * 2); s.fill();

  // a couple of soft daytime clouds
  s.fillStyle = 'rgba(255,255,255,0.65)';
  [[70, horizonY * 0.3, 1], [W - 90, horizonY * 0.2, 0.8]].forEach(([cx, cy, sc2]) => {
    for (let i = 0; i < 4; i++) {
      s.beginPath();
      s.ellipse(cx + i * 16 * sc2, cy, 16 * sc2, 9 * sc2, 0, 0, Math.PI * 2);
      s.fill();
    }
  });

  // quad / lawn ground below the horizon -- grass gone gold-brown for fall
  const ground = s.createLinearGradient(0, horizonY, 0, H);
  ground.addColorStop(0, '#8a7136');
  ground.addColorStop(1, '#4a3a1e');
  s.fillStyle = ground;
  s.fillRect(0, horizonY, W, H - horizonY);

  // campus skyline silhouette (warm brick tone instead of dusk-purple)
  s.fillStyle = '#5a3826';
  const towerX = W * 0.5, towerW = 34, towerH = 118;
  s.fillRect(towerX - towerW / 2, horizonY - towerH, towerW, towerH);
  s.beginPath();
  s.moveTo(towerX - towerW / 2 - 5, horizonY - towerH);
  s.lineTo(towerX, horizonY - towerH - 42);
  s.lineTo(towerX + towerW / 2 + 5, horizonY - towerH);
  s.closePath();
  s.fill();
  s.fillStyle = '#ffe6a3';
  s.beginPath(); s.arc(towerX, horizonY - towerH + 28, 9, 0, Math.PI * 2); s.fill();

  function building(bx, bw, bh) {
    s.fillStyle = '#5a3826';
    s.fillRect(bx, horizonY - bh, bw, bh);
    s.fillStyle = 'rgba(255,222,160,0.55)';
    for (let wy = horizonY - bh + 10; wy < horizonY - 8; wy += 13) {
      for (let wx = bx + 6; wx < bx + bw - 6; wx += 13) {
        if (Math.random() < 0.55) s.fillRect(wx, wy, 6, 7);
      }
    }
  }
  building(towerX - towerW / 2 - 72, 66, 68);
  building(towerX + towerW / 2 + 6, 66, 52);
  building(14, 46, 36);
  building(W - 60, 46, 42);

  // trees in full autumn color (a mix of gold, orange, and red canopies)
  const fallCanopyColors = ['#d99a2b', '#c8632c', '#a33b2b', '#e0b23f'];
  function tree(tx, s2, colorIdx) {
    s.fillStyle = '#4a3421';
    s.fillRect(tx - 2, horizonY - 16 * s2, 4, 16 * s2);
    s.fillStyle = fallCanopyColors[colorIdx % fallCanopyColors.length];
    s.beginPath(); s.arc(tx, horizonY - 20 * s2, 13 * s2, 0, Math.PI * 2); s.fill();
    s.fillStyle = fallCanopyColors[(colorIdx + 1) % fallCanopyColors.length];
    s.beginPath(); s.arc(tx - 5 * s2, horizonY - 24 * s2, 8 * s2, 0, Math.PI * 2); s.fill();
  }
  tree(50, 1, 0); tree(78, 0.75, 2);
  tree(W - 48, 1, 1); tree(W - 78, 0.8, 3);

  // fallen leaves scattered across the quad
  function leaf(lx, ly, scale, colorIdx, rot) {
    s.save();
    s.translate(lx, ly);
    s.rotate(rot);
    s.fillStyle = fallCanopyColors[colorIdx % fallCanopyColors.length];
    s.beginPath();
    s.ellipse(0, 0, 4.5 * scale, 2.5 * scale, 0, 0, Math.PI * 2);
    s.fill();
    s.restore();
  }
  for (let i = 0; i < 45; i++) {
    const lx = Math.random() * W;
    const ly = horizonY + 6 + Math.random() * (H - horizonY - 10);
    leaf(lx, ly, 0.7 + Math.random() * 0.7, Math.floor(Math.random() * fallCanopyColors.length), Math.random() * Math.PI * 2);
  }
  // a few leaves drifting in the sky
  for (let i = 0; i < 6; i++) {
    leaf(Math.random() * W, Math.random() * horizonY * 0.9, 0.8, Math.floor(Math.random() * fallCanopyColors.length), Math.random() * Math.PI * 2);
  }

  // crowd of fans gathered on the quad
  function fan(fx, fy, scale) {
    s.fillStyle = '#2c2016';
    s.beginPath();
    s.ellipse(fx, fy, 6 * scale, 10 * scale, 0, 0, Math.PI * 2);
    s.fill();
    s.beginPath();
    s.arc(fx, fy - 12 * scale, 5 * scale, 0, Math.PI * 2);
    s.fill();
  }
  for (let i = 0; i < 24; i++) {
    const fx = 18 + Math.random() * (W - 36);
    const fy = horizonY + 18 + Math.random() * (H - horizonY - 34);
    fan(fx, fy, 0.7 + Math.random() * 0.6);
  }

  // one fan waving a small pennant flag
  const flagX = W * 0.26, flagBaseY = horizonY + 44;
  s.strokeStyle = '#2c2016';
  s.lineWidth = 2;
  s.beginPath(); s.moveTo(flagX, flagBaseY); s.lineTo(flagX, flagBaseY - 32); s.stroke();
  s.fillStyle = 'rgba(200,60,40,0.9)';
  s.beginPath();
  s.moveTo(flagX, flagBaseY - 32);
  s.lineTo(flagX + 20, flagBaseY - 25);
  s.lineTo(flagX, flagBaseY - 18);
  s.closePath();
  s.fill();

  selectSceneCanvas = sc;
}

function drawSelectScreen() {
  const cw = COLORWAYS[colorwayIndex];

  if (selectSceneCanvas) {
    ctx.drawImage(selectSceneCanvas, 0, 0);
  } else {
    ctx.fillStyle = '#173a1f';
    ctx.fillRect(0, 0, W, H);
  }

  // solid (opaque) panel so the UI stays legible over the background art
  roundRectPath(ctx, W / 2 - 160, H / 2 - 160, 320, 330, 14);
  ctx.fillStyle = '#14101c';
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 22px Segoe UI';
  ctx.fillText('SELECT YOUR CONFERENCE', W / 2, H / 2 - 122);

  // static pose (no run-cycle animation) for the menu preview
  drawFootballPlayer(ctx, W / 2, H / 2 - 90, 80, 116, cw, 7, 0);

  ctx.font = 'bold 20px Segoe UI';
  ctx.fillStyle = colorwayIndex === 0 ? '#FFCB05' : 'rgba(255,255,255,0.35)';
  ctx.fillText('BIG TEN', W / 2 - 90, H / 2 + 70);
  ctx.fillStyle = colorwayIndex === 1 ? '#ffffff' : 'rgba(255,255,255,0.35)';
  ctx.fillText('SEC', W / 2 + 90, H / 2 + 70);

  ctx.fillStyle = '#ddd';
  ctx.font = '15px Segoe UI';
  ctx.fillText('SPACE to toggle colorway', W / 2, H / 2 + 115);
  ctx.fillText('ENTER to kick off', W / 2, H / 2 + 140);
}

let lastTime = performance.now();
function loop(now) {
  const dt = now - lastTime;
  lastTime = now;
  frameClock += dt;

  update(dt);

  if (state === 'select') {
    drawSelectScreen();
  } else if (state === 'champion') {
    drawChampionScreen();
  } else {
    drawField();
    drawDefenders();
    drawPlayer();
    drawHUD();

    if (state === 'tackled') {
      drawOverlay('TACKLED!', 'Press ENTER to pick a conference and start over');
    } else if (state === 'touchdown') {
      drawOverlay('TOUCHDOWN!', `Press ENTER for another drive (level: ${difficultyLevel})`);
    }
  }

  requestAnimationFrame(loop);
}

initGrassTexture();
initStands();
initSelectScene();
resetGame();
requestAnimationFrame(loop);
</script>
